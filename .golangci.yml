version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
    - wrapcheck
    - testifylint
  settings:
    wrapcheck:
      ignore-sigs: ["fmt.Errorf(", "errors.New("]
  exclusions:
    rules:
      - path: _test\.go
        linters: [wrapcheck]

formatters:
  enable:
    - gofmt
    - goimports
